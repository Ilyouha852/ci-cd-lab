# __TAG__ подставляется scripts/deploy.ps1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-app
  namespace: car-accounting
spec:
  # Две реплики делят один PVC с SQLite. Это допустимо только в однонодовом
  # лабораторном кластере (minikube): все поды на одном узле, блокировки файла
  # SQLite работают. Для многонодового кластера нужна клиент-серверная СУБД.
  replicas: 2
  selector:
    matchLabels:
      app: car-app
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}   # обновление без простоя
  template:
    metadata:
      labels:
        app: car-app
    spec:
      containers:
        - name: app
          image: car-accounting/app:__TAG__
          imagePullPolicy: IfNotPresent
          # Схему БД создаёт Job db-init, поэтому init_db() из CMD образа не нужен.
          command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2",
                    "--access-logfile", "-", "--error-logfile", "-", "app:app"]
          ports:
            - containerPort: 5000
          env:
            - {name: DATABASE_PATH, value: /data/cars.db}
            - name: SECRET_KEY
              valueFrom: {secretKeyRef: {name: app-secret, key: SECRET_KEY}}
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe:
            httpGet: {path: /ready, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cars-data
---
apiVersion: v1
kind: Service
metadata:
  name: car-app
  namespace: car-accounting
spec:
  selector:
    app: car-app
  ports:
    - port: 80
      targetPort: 5000
