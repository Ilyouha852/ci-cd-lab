# __TAG__ подставляется scripts/deploy.ps1
# Одноразовая инициализация БД каждого сервиса: схема + демо-данные (идемпотентно).
# Вынесено в Job, чтобы несколько реплик не создавали и не заполняли БД одновременно.
# deploy.ps1 пересоздаёт Job'ы при каждом деплое.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-cars
  namespace: car-accounting
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: init
          image: car-accounting/cars-service:__TAG__
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "from database import init_db; init_db()"]
          env:
            - {name: DATABASE_PATH, value: /data/cars_service.db}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cars-data
---
