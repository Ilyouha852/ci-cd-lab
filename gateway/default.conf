# Единый gateway для Docker Compose и Kubernetes: в обеих средах сервисы доступны
# по именам cars-service и owners-service на порту 5000.
server {
    listen 80;
    server_name localhost;

    # имя пода/контейнера gateway: видно, какая реплика ответила
    add_header X-Gateway $hostname always;

    # проба самого gateway (не зависит от сервисов)
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /owners { return 301 /owners/; }

    # владельцы: веб-интерфейс и REST API -> owners-service
    location ~ ^/(owners/|api/owners) {
        proxy_pass http://owners-service:5000;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # всё остальное (главная, автомобили, марки, модели, техосмотры, страховки) -> cars-service
    location / {
        proxy_pass http://cars-service:5000;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
