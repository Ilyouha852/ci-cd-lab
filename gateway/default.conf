# Конфигурация gateway для Kubernetes. Для Docker Compose используется nginx/nginx.conf.
server {
    listen 80;
    server_name localhost;

    # имя пода gateway: видно, какая реплика ответила
    add_header X-Gateway $hostname always;

    # проба самого gateway (не зависит от приложения)
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        proxy_pass http://car-app;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
