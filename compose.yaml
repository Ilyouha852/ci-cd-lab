# Три контейнера: два сервиса со своими БД (отдельные тома) и gateway.
# Имена образов = репозитории на Docker Hub:
#   ${IMAGE_REPO}-cars-service, ${IMAGE_REPO}-owners-service, ${IMAGE_REPO}-gateway.
# Локально (без переменных): car-accounting-cars-service:latest и т. д.
x-healthcheck: &py-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

services:
  cars-service:
    image: ${IMAGE_REPO:-car-accounting}-cars-service:${IMAGE_TAG:-latest}
    build:
      context: ./cars-service
    environment:
      DATABASE_PATH: /data/cars_service.db
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      OWNERS_SERVICE_URL: http://owners-service:5000
    volumes:
      - cars_data:/data
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/ready', timeout=3)"]
      <<: *py-healthcheck

  owners-service:
    image: ${IMAGE_REPO:-car-accounting}-owners-service:${IMAGE_TAG:-latest}
    build:
      context: ./owners-service
    environment:
      DATABASE_PATH: /data/owners_service.db
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      CARS_SERVICE_URL: http://cars-service:5000
    volumes:
      - owners_data:/data
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/ready', timeout=3)"]
      <<: *py-healthcheck

  gateway:
    image: ${IMAGE_REPO:-car-accounting}-gateway:${IMAGE_TAG:-latest}
    build:
      context: ./gateway
    ports:
      - "80:80"
    depends_on:
      # restart: true - при пересоздании сервиса gateway перезапускается и заново
      # резолвит его адрес (nginx запоминает IP при старте)
      cars-service:
        condition: service_healthy
        restart: true
      owners-service:
        condition: service_healthy
        restart: true
    restart: unless-stopped

volumes:
  cars_data:
  owners_data:
