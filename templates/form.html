{% extends "base.html" %}{% block title %}{{cfg.title}}{% endblock %}{% block content %}<h1>{{'Редактирование' if row else 'Добавление'}}: {{cfg.title}}</h1><form class="form" method="post">{% for c in cfg.columns %}<label>{{cfg.labels[c]}}{% if c in options %}<select name="{{c}}" required>{% for x in options[c] %}<option value="{{x.id}}" {% if row and row[c]==x.id %}selected{% endif %}>{{x.label}}</option>{% endfor %}</select>{% elif c in ['inspection_date','next_inspection_date','start_date','end_date'] %}<input type="date" name="{{c}}" value="{{row[c] if row else ''}}" required>{% elif c=='status' %}<select name="status">{% for x in ['Активен','На ремонте','Продан','Списан'] %}<option {% if row and row[c]==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select>{% elif c=='result' %}<select name="result"><option>Пройден</option><option>Не пройден</option></select>{% elif c=='insurance_type' %}<select name="insurance_type"><option>ОСАГО</option><option>КАСКО</option></select>{% elif c in ['production_year','mileage'] %}<input type="number" name="{{c}}" min="0" value="{{row[c] if row else ''}}" required>{% elif c=='cost' %}<input type="number" name="cost" step="0.01" min="0" value="{{row[c] if row else 0}}" required>{% elif c=='email' %}<input type="email" name="{{c}}" value="{{row[c] if row else ''}}">{% else %}<input name="{{c}}" value="{{row[c] if row else ''}}">{% endif %}</label>{% endfor %}<div><a class="btn" href="/{{entity}}/">Отмена</a> <button class="btn primary">Сохранить</button></div></form>{% endblock %}
